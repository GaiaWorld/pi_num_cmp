[package]
name = "pi_num_cmp"
version = "0.2.0"
authors = ["zmythleo <zmythleo@gmail.com>"]
edition = "2021"
description = "size int bigint float num cmp"
repository = "https://github.com/GaiaWorld/pi_num_cmp.git"
license = "MIT OR Apache-2.0"
keywords = ["pi", "num", "cmp", "bigint", "order"]


[dependencies]
derive-deref-rs = "0.1"
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"], optional = true }
fory = { version = "1.7", optional = true }

[features]
serde = ["dep:serde", "num-bigint/serde"]
fory = ["dep:fory"]

[dev-dependencies]
malachite = "0.6"
malachite-base = "0.6"
serde_json = "1"
